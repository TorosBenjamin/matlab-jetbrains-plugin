<html><body>
Reports functions and classes from packages (<code>+pkg</code> folders) that are used by their plain name without
an <code>import</code>, which MATLAB can't find: <code>Point(1)</code> for <code>+geometry/Point.m</code>.
<p>Quick fixes add <code>import geometry.Point</code> to the function (or script), or write
<code>geometry.Point(1)</code>.</p>
</body></html>
